# Netlify (static SPA, alternative to Cloudflare Pages)
# Chosen split: Cloudflare Pages (web, preferred) + Render (API) + Turso (memory).
# If using Netlify instead of Cloudflare Pages, set VITE_API_BASE_URL to the
# Render API origin and set server CORS_ORIGIN to this site's origin.

[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  # Example: VITE_API_BASE_URL = "https://innerview-api.onrender.com"

# SPA fallback for client-side routing/deep links
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
