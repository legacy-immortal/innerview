# Render Blueprint (example) - API service for Innerview
# Chosen split: Cloudflare Pages (web) + Render (API) + Turso (remote memory).
# Set VITE_API_BASE_URL on Cloudflare Pages to this service URL, and set
# CORS_ORIGIN here to the Pages/custom web origin.
services:
  - type: web
    name: innerview-api
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3002
      - key: CORS_ORIGIN
        sync: false # e.g. https://innerview.pages.dev or custom domain
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
